name: Bug report
description: Something does not work the way the documentation says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The health check output below is the single most
        useful thing you can give us: it names the pyenv root, the file that
        chose the current environment, and - for every running Python language
        server - the interpreter it is *really* using. Most reports are answered
        from that alone.

  - type: textarea
    id: health
    attributes:
      label: ":checkhealth pyenv output"
      description: Run `:checkhealth pyenv` and paste the whole pyenv.nvim section.
      render: text
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        Steps, ideally from a minimal config. `spec/minimal_init.lua` in this
        repository is a reasonable starting point.
      placeholder: |
        1. In a project containing ...
        2. Run :Pyenv ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: nvim-version
    attributes:
      label: Neovim version
      description: The first line of `nvim --version`.
      placeholder: NVIM v0.11.0
    validations:
      required: true

  - type: input
    id: pyenv-version
    attributes:
      label: pyenv version
      description: Output of `pyenv --version`, or "not installed".
      placeholder: pyenv 2.8.5
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.6 (Apple Silicon)
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your pyenv.nvim configuration
      description: The options you pass to `setup()`. Leave blank if you use the defaults.
      render: lua
    validations:
      required: false
